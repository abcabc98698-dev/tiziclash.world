<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  
  <!-- Subtle decorative grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="80" y1="0" x2="80" y2="630" />
    <line x1="1120" y1="0" x2="1120" y2="630" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>
  
  <!-- Accent top bar -->
  <rect x="0" y="0" width="1200" height="8" fill="url(#brand)" />
  
  <!-- Main Badge -->
  <rect x="120" y="140" width="160" height="38" rx="19" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <text x="200" y="164" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600" fill="#f87171" text-anchor="middle" letter-spacing="1.5">CURRICULUM VITAE</text>
  
  <!-- Title / Name -->
  <text x="120" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="#ffffff" letter-spacing="-1">
    Professional Profile &amp; CV
  </text>
  
  <!-- Role / Subtitle -->
  <text x="120" y="325" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">
    Senior Software Engineer &amp; Platform Architecture
  </text>
  
  <!-- Bio excerpt -->
  <text x="120" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" fill="#64748b">
    High reliability systems · Event-driven architectures · Developer platforms
  </text>
  
  <!-- Footer domain branding -->
  <circle cx="136" cy="495" r="8" fill="url(#brand)" />
  <text x="156" y="502" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">
    tiziclash.world
  </text>
</svg>
